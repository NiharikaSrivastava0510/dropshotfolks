# Copies Firebase's sign-in helper pages onto this site, so Google sign-in
# shows dropshotfolks.co.uk instead of dropshotfolks.firebaseapp.com.
# Run it from the Actions tab (or it runs when this file changes); it commits any updates.
name: Update Firebase sign-in helper files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/firebase-auth-files.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download helper files
        run: |
          set -uo pipefail
          base=https://dropshotfolks.firebaseapp.com
          mkdir -p __/auth
          fail=0
          for pair in "handler:handler.html" "handler.js:handler.js" "experiments.js:experiments.js" "iframe:iframe.html" "iframe.js:iframe.js"; do
            src=${pair%%:*}; dst=${pair##*:}
            code=$(curl -sSL -o "__/auth/$dst" -w '%{http_code}' "$base/__/auth/$src")
            echo "$src -> $code ($(wc -c < "__/auth/$dst") bytes)"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __
          git diff --cached --quiet && echo "No changes" || git commit -m "Update Firebase sign-in helper files"
          git push
